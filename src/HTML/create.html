    <main class="auth-page">
        <section class="page-section auth-card">
            <h1>Create an Account</h1>
            <p class="subhead">Save your training to your account so it's on every device.</p>
            <form id="inputSect" class="auth-form">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required aria-describedby="password-hint">
                    <p id="password-hint" class="auth-hint">At least 6 characters.</p>
                </div>
                <button type="submit" class="save-btn auth-submit">Create Account</button>
                <p id="auth-message" role="status"></p>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>
</body>
</html>
