<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../CSS/shared/base.css">
    <link rel="stylesheet" href="../CSS/shared/nav.css">
    <link rel="stylesheet" href="../CSS/shared/forms.css">
    <link rel="stylesheet" href="../CSS/pages/dogs.css">
    <!-- shared scripts, then this page's script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../JS/shared/supabaseClient.js" defer></script>
    <script src="../JS/shared/dogs.js" defer></script>
    <script src="../JS/shared/sessions.js" defer></script>
    <script src="../JS/shared/accountNav.js" defer></script>
    <script src="../JS/pages/dogs.js" defer></script>
</head>
<body>
    <div class="top-nav">
        <details class="nav-dropdown">
            <summary class="home-link nav-dropdown-toggle">Directory</summary>
            <div class="nav-dropdown-menu">
                <a href="index.html">Home</a>
                <a href="today.html">Today</a>
                <a href="commands.html">Commands</a>
                <a href="log.html">Log</a>
                <a href="load.html">View Logs</a>
                <a href="dogs.html">My Dogs</a>
                <a href="settings.html">Settings</a>
            </div>
        </details>
        <div class="top-nav-links">
            <a class="home-link" href="create.html" target="_blank" rel="noopener noreferrer">Create Account</a>
            <a class="home-link" href="login.html" target="_blank" rel="noopener noreferrer">Login</a>
        </div>
    </div>

    <h1>My Dogs</h1>
    <p class="subhead">Choose which dog you're training. New sessions are logged for that dog.</p>

    <p id="dogs-status" class="dogs-status" role="status">Loading your dogs...</p>

    <!-- dogs.js shows these once someone is signed in -->
    <section id="dog-list-section" class="page-section" hidden>
        <h2 class="section-title">Your Dogs</h2>
        <p id="dog-list-empty" class="dog-list-empty" hidden>No dogs yet. Add your first dog below.</p>
        <ul id="dog-list" class="dog-list"></ul>
    </section>

    <section id="add-dog-section" class="page-section" hidden>
        <h2 class="section-title">Add a Dog</h2>
        <form id="add-dog-form" class="field-row">
            <label class="visually-hidden" for="new-dog-name">Dog's name</label>
            <input type="text" id="new-dog-name" placeholder="Enter your dog's name..." maxlength="50" required>
            <button class="save-btn" type="submit">Add Dog</button>
        </form>
    </section>
</body>
</html>
