    <a class="dog-chart-back" href="dogs.html">&larr; My Dogs</a>
    <h1 id="dog-chart-name">Dog Chart</h1>
    <p id="dog-chart-meta" class="subhead">Everything about your dog in one place: basics, health, daily care and behavior.</p>

    <!-- dog.js shows this when the account has more than one dog -->
    <div id="dog-chart-picker-row" class="field-row dog-chart-picker-row" hidden>
        <label for="dog-chart-picker">Dog:</label>
        <select id="dog-chart-picker"></select>
    </div>

    <p id="dog-chart-status" class="dog-chart-status" role="status">Loading...</p>

    <!-- dog.js builds the chart's sections from CHART_SECTIONS once the dog has loaded -->
    <form id="dog-chart-form" class="dog-chart-form" hidden novalidate>
        <div id="dog-chart-sections"></div>
        <!-- stays on screen at the bottom while scrolling, so saving is always one click away -->
        <div class="dog-chart-savebar">
            <span id="dog-chart-save-status" class="dog-chart-save-status" role="status"></span>
            <button type="submit" id="dog-chart-save" class="save-btn">Save Chart</button>
        </div>
    </form>
</body>
